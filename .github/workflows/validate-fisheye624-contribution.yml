name: Validate Fisheye624 contribution

on:
  push:
    branches: [validate-fisheye624-optical-axis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparative-development-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        revision: [upstream-baseline, contribution]
    steps:
      - uses: actions/checkout@v3
      - name: Select exact unchanged upstream for baseline
        if: matrix.revision == 'upstream-baseline'
        run: |
          git fetch --depth 1 https://github.com/nerfstudio-project/nerfstudio.git 50e0e3c70c775e89333256213363badbf074f29d
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.13'
          cache: pip
      - name: Install system Open3D runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install project development and documentation dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --upgrade -e '.[dev,docs]' 'numpy==1.26.4' 'setuptools<81' 'open3d==0.18.0'
      - name: Check resolved dependency consistency
        run: uv pip check --system
      - name: Check license headers
        run: bash nerfstudio/scripts/licensing/license_headers.sh --check
      - name: Check notebook cell metadata
        if: always()
        run: python nerfstudio/scripts/docs/add_nb_tags.py --check
      - name: Run repository lint
        if: always()
        run: ruff check docs/ nerfstudio/ tests/ --output-format=github
      - name: Check repository formatting
        if: always()
        run: ruff format docs/ nerfstudio/ tests/ --check
      - name: Run repository type checks
        if: always()
        run: pyright
      - name: Run repository pytest configuration
        if: always()
        run: pytest
      - name: Build documentation without deployment
        if: always()
        run: sphinx-build docs _build -W --keep-going
      - name: Check for tracked file mutations
        if: always()
        run: git diff --exit-code
