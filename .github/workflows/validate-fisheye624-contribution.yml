name: Validate Fisheye624 contribution

on:
  push:
    branches: [validate-fisheye624-optical-axis]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-development-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.13'
          cache: pip
      - name: Install project development and documentation dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system --upgrade -e '.[dev,docs]'
      - name: Run complete project development checks
        run: ns-dev-test
      - name: Check for changes introduced by development tooling
        run: git diff --exit-code
